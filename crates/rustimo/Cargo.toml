[package]
name = "rustimo"
version = "0.1.0"
edition = "2024"

[dependencies]
rustimo_macros = { path = "../rustimo_macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
